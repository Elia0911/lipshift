[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lipshift"
version = "0.1.0"
description = "Where lip-reading deepfake detectors break: language shift, generator shift and calibrated abstention."
readme = "README.md"
license = "MIT"
authors = [{ name = "Eli OUN" }]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "torch==2.15.0",
]

[project.optional-dependencies]
# Feature extraction (run on Colab / a GPU machine). Also needs the Auto-AVSR and
# multilingual VSR repositories cloned at the commits listed in configs/extract.yaml.
extract = [
    "torchvision==0.29.2",
    "torchaudio==2.11.1",
    "opencv-python-headless==5.0.0.93",
    "mediapipe==1.2.2",
    "scikit-image==0.26.0",
    "sentencepiece==0.2.3",
    "six==1.17.0",
    "huggingface_hub==2.4.0",
    "datasets==5.2.0",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs cloned Auto-AVSR repo and a face model (set LIPSHIFT_AUTO_AVSR, LIPSHIFT_FACE_MODEL)"]
